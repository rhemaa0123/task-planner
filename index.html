<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page use the full screen on a notched
         phone; every fixed element then subtracts env(safe-area-inset-*)
         so nothing sits under the notch or the home indicator. The two go
         together: without cover the insets are all 0px, and without the
         insets cover puts the menu button under the camera.
         No maximum-scale and no user-scalable=no - pinch zoom stays. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- So the browser chrome follows the theme rather than staying white -->
    <meta name="theme-color" content="#F0F0DB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131317" media="(prefers-color-scheme: dark)" />
    <title>Hardlife on Software</title>
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Stamped before first paint so the page never flashes the wrong theme
      (function () {
        try {
          var saved = localStorage.getItem('task-planner-theme');
          var mode = ['light', 'dark', 'auto'].indexOf(saved) >= 0 ? saved : 'auto';
          var dark = mode === 'dark' || (mode === 'auto' &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
